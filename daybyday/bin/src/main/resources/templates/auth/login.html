<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/unauth-header}">
<head>
    <title>Login</title>
    <style>

        main {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            width: 400px;
            height: auto;
            text-align: center;
            border: 1px solid lightgrey;
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h3 {
            color: #21579e;
        }

        .element input, .element button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            outline: none;
            border: 1px solid lightgrey;
        }

        .element button {
            background-color: #104283;
            border: 1px solid #104283;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
        }

        .element button:hover {
            background-color: #1f66d8;
            border-color: #1f66d8;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transform: scale(1.01);
        }

    </style>
</head>
<body>
    <div class="content" layout:fragment="content">
        <main>
            <form class="formulaire" th:action="@{/auth/process-login}" th:object="${loginDTO}" method="post">

                <h3>Connexion</h3>

                <div th:if="${message}" style="color: green; font-weight: bold;">
                    <p th:text="${message}"></p>
                </div>
                
                <div th:if="${errorMessage}" style="color: red; font-weight: bold;">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="element">
                    <input type="text" th:field="*{email}" placeholder="email@gmail.com">
                </div>

                <div class="element">
                    <input type="password" th:field="*{password}" placeholder="********">
                </div>

                <div class="element">
                    <button type="submit">connexion</button>
                </div>

            </form>
        </main>
    </div>
</body>
</html>
