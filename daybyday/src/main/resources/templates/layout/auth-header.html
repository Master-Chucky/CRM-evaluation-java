<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>unauth-header</title>
    <style>

        @font-face {
            font-family: 'Poppins';
            src: url('/fonts/Poppins-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('/fonts/Poppins-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('/fonts/Poppins-Italic.ttf') format('truetype');
            font-weight: 400;
            font-style: italic;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            width: 100vw;
            height: 8vh;
            padding-left: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #104283;
        }

        .section-logo {
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 5px;
        }

        .section-logo a{
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }

        .section-logo img {
            width: 40px;
            height: 40px;
            object-fit: cover;
        }

        .section-lien ul {
            display: flex;
            gap: 20px;
            margin-right: 30px;
        }

        .section-lien ul .lien {
            list-style: none;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .section-lien ul .lien a {
            text-decoration: none;
            font-weight: bolder;
            font-size: 0.8rem;
            color: white;
        }

        .content {
            width: 100vw;
            height: 92vh;
        }
        
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="section-logo">
            <!-- <img src="icons/white-logo.png" alt=""> -->
            <a href="#" th:href="@{/dashboard}">CRM</a>
        </div>
        <div class="section-lien">
            <ul>
                <li class="lien">
                    <!-- <a href="#">about</a> -->
                </li>
            </ul>
        </div>
    </nav>

    <div class="content" id="content">
        <div layout:fragment="content"></div>
    </div>

</body>
</html>
