<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Liste des Ventes</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="formulaire" th:action="@{/auth/process-login}" th:object="${loginDTO}" method="post">
            <div class="element">
                <input type="text" th:field="*{email}" placeholder="email@gmail.com">
            </div>
            <div class="element">
                <input type="text" th:field="*{passe}" placeholder="********">
            </div>
            <div class="element">
                <button type="submit">rechercher</button>
            </div>
        </form>
    </div>
</body>
</html>
